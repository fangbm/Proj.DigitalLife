[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digitallife-v2"
version = "2.0.0a14"
description = "Bounded Android exploration with source-linked life continuity"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<13"]

[project.scripts]
digitallife-v2 = "digitallife_v2.__main__:main"

[tool.setuptools.packages.find]
include = ["digitallife_v2*"]
